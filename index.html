<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>凯琳的专属小空间</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
        }
        body {
            background-color: #f0f8ff;
            text-align: center;
            padding: 50px 20px;
            transition: background-color 0.5s;
        }
        h1 {
            color: #2c3e50;
            margin-bottom: 30px;
            font-size: 2.5em;
            /* 文字闪烁动画 */
            animation: twinkle 2s infinite alternate;
        }
        /* 文字闪烁动画 */
        @keyframes twinkle {
            from { opacity: 0.8; }
            to { opacity: 1; }
        }
        /* 图片摇摆动画 */
        @keyframes swing {
            0% { transform: rotate(-5deg); }
            100% { transform: rotate(5deg); }
        }
        .goat-section {
            margin: 40px 0;
            padding: 20px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            display: inline-block;
        }
        .goat-img {
            width: 150px;
            height: auto;
            margin: 20px 0;
            animation: swing 2s ease-in-out infinite alternate;
        }
        .love-text {
            font-size: 1.3em;
            color: #e91e63;
            margin: 20px 0;
            font-weight: bold;
            letter-spacing: 2px;
        }
        .pic-box {
            margin: 30px 0;
        }
        .show-pic {
            width: 200px;
            border-radius: 10px;
            box-shadow: 0 3px 10px #ccc;
        }
        p {
            color: #34495e;
            font-size: 1.2em;
            margin: 10px 0;
        }
        button {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 12px 24px;
            margin: 10px;
            border-radius: 8px;
            font-size: 1em;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #45a049;
        }
        .btn1 { background-color: #2196F3; }
        .btn1:hover { background-color: #1976D2; }
        .btn2 { background-color: #FF9800; }
        .btn2:hover { background-color: #F57C00; }
        .btn3 { background-color: #9C27B0; }
        .btn3:hover { background-color: #7B1FA2; }
        .btn4 { background-color: #E91E63; }
        .btn4:hover { background-color: #C2185B; }
        .btn5 { background-color: #00BCD4; }
        .btn5:hover { background-color: #0097A7; }
        .btn6 { background-color: #8BC34A; }
        .btn6:hover { background-color: #689F38; }
        .btn7 { background-color: #ff5722; }
        .btn7:hover { background-color: #e64a19; }
        .btn8 { background-color: #673ab7; }
        .btn8:hover { background-color: #5e35b1; }
    </style>
</head>
<body>
    <h1>欢迎来到凯琳的迷你小空间 ✨</h1>
    <p>你好呀！这里是凯琳的专属小世界，慢慢完善中~</p>

    <!-- 表白文字 -->
    <div class="love-text">
        ❤️ 心之所向，皆是美好，永远偏爱凯琳 ❤️
    </div>

    <!-- 展示图片 + 摇摆动画 -->
    <div class="pic-box">
        <h3>美好瞬间</h3>
        <img class="show-pic" src="https://picsum.photos/400/300" alt="精美配图">
    </div>

    <div class="goat-section">
        <h2>🐐 GOAT 专区</h2>
        <img src="https://img.icons8.com/emoji/96/goat-emoji.png" alt="山羊" class="goat-img">
        <p>GOAT = Greatest Of All Time</p>
        <p>凯琳就是史上最佳！</p>
    </div>

    <!-- 背景音乐播放器 -->
    <audio id="bgMusic" loop>
        <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
    

    <!-- 功能按钮区 -->
    <div>
        <button onclick="sayHi()">点我打招呼</button>
        <button onclick="alert('💤 下次再来玩哦~')">关闭小空间</button>
        <button class="btn1" onclick="showQuote()">点我看名言</button>
        <button class="btn2" onclick="goGithub()">访问我的GitHub</button>
        <button class="btn3" onclick="changeBg()">换个背景色</button>
        <button class="btn4" onclick="showTime()">显示当前时间</button>
        <button class="btn5" onclick="love()">凯琳最棒</button>
        <button class="btn6" onclick="goat()">凯琳 = GOAT</button>
        <button class="btn7" onclick="playMusic()">播放/暂停音乐</button>
        <button class="btn8" onclick="goTelegram()">跳转 Telegram</button>
    </div>

    <script>
        // 打招呼
        function sayHi() {
            alert('🐐 你好呀！我是凯琳！');
        }
        // 名人名言
        function showQuote() {
            alert('💡 星光不问赶路人，时光不负有心人。');
        }
        // 跳转GitHub
        function goGithub() {
            window.open('https://github.com/3211943529-sys/telegramgerenkongjian','_blank');
        }
        // 切换背景色
        function changeBg() {
            let colors = ['#f0f8ff','#e8f5e9','#fff3e0','#f3e5f5','#ffe0e0'];
            let random = Math.floor(Math.random() * colors.length);
            document.body.style.backgroundColor = colors[random];
        }
        // 显示时间
        function showTime() {
            let now = new Date();
            alert('⏰ 当前时间：' + now.toLocaleString());
        }
        // 夸赞语句
        function love() {
            alert('💖 凯琳超棒！永远闪闪发光！');
        }
        // GOAT 提示
        function goat() {
            alert('🐐 凯琳就是 GOAT！史上最佳！');
        }
        // 音乐播放暂停
        let music = document.getElementById("bgMusic");
        function playMusic() {
            if(music.paused){
                music.play();
                alert("🎵 音乐已开始播放");
            }else{
                music.pause();
                alert("🎵 音乐已暂停");
            }
        }
        // 跳转Telegram（替换成你自己的TG链接）
        function goTelegram() {
            // 把下面链接改成你的TG群组/账号链接
            window.open('https://t.me/你的TG账号或群组','_blank');
        }
    </script>
</body>
</html>
